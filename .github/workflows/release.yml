name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SOLUTION: foo_dsd_trellis.sln
  FB2K_SDK_URL: https://www.foobar2000.org/files/SDK-2025-03-07.zip
  ONNXRUNTIME_VERSION: 1.21.1

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x64]
        configuration: [Release]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      shell: bash
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install VS 2019 Build Tools (v142 toolset)
      shell: pwsh
      run: |
        $installerPath = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
        & $installerPath modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
          --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 `
          --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          --quiet --norestart --wait 2>$null
        # v142 is typically available on windows-2022 runners

    - name: Download foobar2000 SDK
      shell: bash
      run: |
        curl -L -o sdk.zip "${{ env.FB2K_SDK_URL }}"
        mkdir -p foobar2000-sdk
        unzip -o sdk.zip -d foobar2000-sdk

    - name: Restore IPP NuGet packages
      shell: bash
      run: |
        nuget restore ${{ env.SOLUTION }} || true
        # IPP packages referenced in vcxproj:
        #   intelipp.devel.win-x64.2022.3.0.387
        #   intelipp.static.win-x64.2022.3.1.8
        nuget install intelipp.devel.win-x64 -Version 2022.3.0.387 -OutputDirectory packages
        nuget install intelipp.static.win-x64 -Version 2022.3.1.8 -OutputDirectory packages

    - name: Download ONNX Runtime
      shell: bash
      run: |
        nuget install Microsoft.ML.OnnxRuntime.DirectML \
          -Version ${{ env.ONNXRUNTIME_VERSION }} \
          -OutputDirectory packages
        ORT_DIR="packages/Microsoft.ML.OnnxRuntime.DirectML.${{ env.ONNXRUNTIME_VERSION }}"
        cp "$ORT_DIR/runtimes/win-x64/native/onnxruntime.dll" deps/x64/
        cp "$ORT_DIR/runtimes/win-x64/native/onnxruntime_providers_shared.dll" deps/x64/

    - name: Build
      shell: bash
      run: |
        msbuild ${{ env.SOLUTION }} \
          -p:Configuration=${{ matrix.configuration }} \
          -p:Platform=${{ matrix.platform }} \
          -v:minimal -nologo

    - name: Run tests
      shell: bash
      run: |
        bin/${{ matrix.configuration }}/${{ matrix.platform }}/foo_dsd_trellis_test.exe
      continue-on-error: false

    - name: Package fb2k component
      shell: bash
      run: |
        STAGE="stage/foo_dsd_trellis"
        mkdir -p "$STAGE"

        # Main plugin DLL
        cp "bin/${{ matrix.configuration }}/${{ matrix.platform }}/foo_dsd_trellis.dll" "$STAGE/"

        # Runtime dependencies
        cp deps/x64/soxr.dll "$STAGE/"
        cp deps/x64/onnxruntime.dll "$STAGE/"
        cp deps/x64/onnxruntime_providers_shared.dll "$STAGE/"

        # ML models
        cp models/*.onnx "$STAGE/"

        # Create .fb2k-component (zip archive)
        cd stage
        7z a -tzip "../foo_dsd_trellis-${{ steps.version.outputs.version }}-x64.fb2k-component" \
          foo_dsd_trellis/

    - name: Upload component artifact
      uses: actions/upload-artifact@v4
      with:
        name: foo_dsd_trellis-${{ steps.version.outputs.version }}-x64
        path: foo_dsd_trellis-*.fb2k-component

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: foo_dsd_trellis v${{ steps.version.outputs.version }}
        body_path: CHANGELOG.md
        files: foo_dsd_trellis-*.fb2k-component
        draft: false
        prerelease: false
