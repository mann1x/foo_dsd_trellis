name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SOLUTION: foo_dsd_trellis.sln
  ONNXRUNTIME_VERSION: 1.24.4
  DIRECTML_VERSION: 1.15.4

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      shell: bash
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Download foobar2000 SDK
      shell: bash
      run: |
        gh release download deps --pattern "fb2k-sdk-*.zip" --dir .
        unzip -o fb2k-sdk-*.zip -d .
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Restore IPP NuGet packages
      shell: bash
      run: |
        nuget install intelipp.devel.win-x64 -Version 2022.3.0.387 -OutputDirectory packages
        nuget install intelipp.static.win-x64 -Version 2022.3.1.8 -OutputDirectory packages

    - name: Download ONNX Runtime (DirectML + CUDA)
      shell: bash
      run: |
        nuget install Microsoft.ML.OnnxRuntime.DirectML \
          -Version ${{ env.ONNXRUNTIME_VERSION }} \
          -OutputDirectory packages
        nuget install Microsoft.ML.OnnxRuntime.Gpu.Windows \
          -Version ${{ env.ONNXRUNTIME_VERSION }} \
          -OutputDirectory packages
        nuget install Microsoft.AI.DirectML \
          -Version ${{ env.DIRECTML_VERSION }} \
          -OutputDirectory packages

    - name: Build x64 Release
      run: |
        msbuild ${{ env.SOLUTION }} -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -v:minimal -nologo

    - name: Run tests (quick suites only)
      shell: bash
      run: |
        bin/Release/x64/foo_dsd_trellis_test.exe --suite dop --suite ntf --suite fir --suite config --suite simd --suite hardening || true
      timeout-minutes: 10

    - name: Download cuDNN
      shell: bash
      run: |
        pip download nvidia-cudnn-cu12 --no-deps -d cudnn_wheel
        cd cudnn_wheel
        unzip -o nvidia_cudnn_cu12-*.whl "nvidia/cudnn/bin/*.dll" -d extracted

    - name: Prepare docs
      shell: bash
      run: |
        cp README.md README.txt
        cp CHANGELOG.md CHANGELOG.txt

    - name: Package base .fb2k-component (DirectML)
      shell: bash
      run: |
        VER="${{ steps.version.outputs.version }}"
        DML_ORT="packages/Microsoft.ML.OnnxRuntime.DirectML.${{ env.ONNXRUNTIME_VERSION }}"
        DML_RT="packages/Microsoft.AI.DirectML.${{ env.DIRECTML_VERSION }}"
        COMP="stage_base_comp"
        mkdir -p "$COMP"

        # Plugin
        cp bin/Release/x64/foo_dsd_trellis.dll "$COMP/"
        cp bin/Release/x64/foo_dsd_trellis_worker.exe "$COMP/"

        # Runtime deps
        cp deps/x64/soxr.dll "$COMP/"

        # ORT DirectML
        cp "$DML_ORT/runtimes/win-x64/native/onnxruntime.dll" "$COMP/"
        cp "$DML_ORT/runtimes/win-x64/native/onnxruntime_providers_shared.dll" "$COMP/"

        # DirectML redistributable
        cp "$DML_RT/bin/x64-win/DirectML.dll" "$COMP/"

        # ML models
        if ls models/*.onnx 1>/dev/null 2>&1; then
          cp models/*.onnx "$COMP/"
        fi

        # Create .fb2k-component (files at zip root)
        cd "$COMP"
        7z a -tzip "../foo_dsd_trellis-${VER}-x64.fb2k-component" .

    - name: Package base .zip (component + docs)
      shell: bash
      run: |
        VER="${{ steps.version.outputs.version }}"
        mkdir -p stage_base_zip
        cp "foo_dsd_trellis-${VER}-x64.fb2k-component" stage_base_zip/
        cp README.txt CHANGELOG.txt stage_base_zip/
        cd stage_base_zip
        7z a -tzip "../foo_dsd_trellis-${VER}-x64.zip" .

    - name: Package CUDA .fb2k-component (DirectML + CUDA)
      shell: bash
      run: |
        VER="${{ steps.version.outputs.version }}"
        DML_ORT="packages/Microsoft.ML.OnnxRuntime.DirectML.${{ env.ONNXRUNTIME_VERSION }}"
        DML_RT="packages/Microsoft.AI.DirectML.${{ env.DIRECTML_VERSION }}"
        GPU_ORT="packages/Microsoft.ML.OnnxRuntime.Gpu.Windows.${{ env.ONNXRUNTIME_VERSION }}"
        COMP="stage_cuda_comp"
        mkdir -p "$COMP"

        # Plugin (same as base)
        cp bin/Release/x64/foo_dsd_trellis.dll "$COMP/"
        cp bin/Release/x64/foo_dsd_trellis_worker.exe "$COMP/"
        cp deps/x64/soxr.dll "$COMP/"

        # ORT DirectML (for DirectML fallback)
        cp "$DML_ORT/runtimes/win-x64/native/onnxruntime.dll" "$COMP/"
        cp "$DML_RT/bin/x64-win/DirectML.dll" "$COMP/"

        # ORT CUDA (renamed to avoid conflict)
        cp "$GPU_ORT/runtimes/win-x64/native/onnxruntime.dll" "$COMP/onnxruntime_cuda.dll"
        cp "$GPU_ORT/runtimes/win-x64/native/onnxruntime_providers_cuda.dll" "$COMP/"
        cp "$GPU_ORT/runtimes/win-x64/native/onnxruntime_providers_shared.dll" "$COMP/"

        # cuDNN DLLs
        cp cudnn_wheel/extracted/nvidia/cudnn/bin/*.dll "$COMP/"

        # ML models
        if ls models/*.onnx 1>/dev/null 2>&1; then
          cp models/*.onnx "$COMP/"
        fi

        # Create .fb2k-component
        cd "$COMP"
        7z a -tzip "../foo_dsd_trellis-${VER}-x64-cuda.fb2k-component" .

    - name: Package CUDA .zip (component + docs)
      shell: bash
      run: |
        VER="${{ steps.version.outputs.version }}"
        mkdir -p stage_cuda_zip
        cp "foo_dsd_trellis-${VER}-x64-cuda.fb2k-component" stage_cuda_zip/
        cp README.txt CHANGELOG.txt stage_cuda_zip/
        cd stage_cuda_zip
        7z a -tzip "../foo_dsd_trellis-${VER}-x64-cuda.zip" .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: foo_dsd_trellis-${{ steps.version.outputs.version }}-x64
        path: |
          foo_dsd_trellis-*-x64.zip
          foo_dsd_trellis-*-x64-cuda.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: foo_dsd_trellis v${{ steps.version.outputs.version }}
        body: |
          ## Install

          **Base (DirectML ML support):**
          Download `foo_dsd_trellis-${{ steps.version.outputs.version }}-x64.zip`, extract, and open the `.fb2k-component` file with foobar2000.

          **CUDA ML support (NVIDIA only):**
          Download `foo_dsd_trellis-${{ steps.version.outputs.version }}-x64-cuda.zip` instead. Includes both DirectML and CUDA support. Requires CUDA Toolkit 12.x installed on the system.

          See CHANGELOG.txt for details.
        files: |
          foo_dsd_trellis-*-x64.zip
          foo_dsd_trellis-*-x64-cuda.zip
        draft: false
        prerelease: false
